[package]
name = "plume-mcp"
version = "0.1.0"
edition = "2021"
description = "stdio MCP server so coding agents can read and write Plume notebook plans"

[dependencies]
plume-core = { path = "../plume-core" }
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
tempfile = "3"
