[package]
name = "plume-core"
version = "0.1.0"
edition = "2021"
description = "Shared SQLite storage for the Plume notebook and its MCP server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.23.3", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.18"
dirs = "6"
